name: Android APK (Godot — ana sürüm)

# godot-program/ projesini (oyunun ana sürümü) Android'e aktarır.
# Uygulama kimliği com.akin.kayipkuleler ve kalıcı anahtar: eski WebView sürümünün (v1.x) üstüne
# güncelleme olarak kurulur. Sürüm kodu 2000 + çalıştırma no (WebView sürüm kodlarından her zaman büyük).
# main'e push, project.godot içindeki config/version için (yoksa) vX.Y.Z yayınını ve release APK'yı oluşturur.
on:
  push:
    branches: [main]
    paths: ['godot-program/**', 'tools/godot-android-export.sh', '.github/workflows/godot-program-android.yml']
  pull_request:
    paths: ['godot-program/**', 'tools/godot-android-export.sh', '.github/workflows/godot-program-android.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Sürüm etiketi (ör. v2.0.0). Doluysa APK Releases sayfasına yüklenir."
        required: false
        default: ''

permissions:
  contents: write

env:
  # Godot 4.8 beta 4 (ön sürümler godotengine/godot-builds deposunda yayınlanır)
  GODOT_VERSION: '4.8'
  GODOT_STATUS: 'beta4'

jobs:
  test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4.0.4
        with:
          # Godot 4.8 beta 4 (güncel derleme) build-tools 36.1.0 ve platform 36 arar.
          # 34, önbellekteki daha eski 4.8 beta ile dışa aktarma için duruyor.
          packages: 'platform-tools build-tools;34.0.0 build-tools;36.1.0 platforms;android-34 platforms;android-36'

      - name: Godot ve şablon önbelleği
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot48
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_STATUS }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}-android-v2

      # İçe aktarma önbelleği: 2K dokuların ETC2/ASTC ve 100 HDR ışık haritasının ASTC sıkıştırması temiz
      # içe aktarmada ~1 saat sürer; sonraki derlemeler yalnızca değişen dosyaları yeniden içe aktarır
      - name: Godot içe aktarma önbelleği (VRAM sıkıştırılmış dokular, ışık haritaları)
        uses: actions/cache@v4
        with:
          path: godot-program/.godot/imported
          key: godot-import-v2-${{ env.GODOT_VERSION }}-${{ hashFiles('godot-program/**/*.import', 'godot-program/project.godot') }}
          restore-keys: |
            godot-import-v2-${{ env.GODOT_VERSION }}-
            godot-import-v2-

      - name: PBR içe aktarma ayarlarını uygula (idempotent)
        run: python3 tools/configure_pbr_imports.py

      - name: Godot + Android şablonlarını indir
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          T=${GODOT_VERSION}.${GODOT_STATUS}; N=Godot_v${GODOT_VERSION}-${GODOT_STATUS}
          URL=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}
          mkdir -p ~/godot48 ~/.local/share/godot/export_templates/$T
          curl -fsSL -o g.zip $URL/${N}_linux.x86_64.zip
          unzip -q g.zip -d ~/godot48 && mv ~/godot48/${N}_linux.x86_64 ~/godot48/godot && rm g.zip
          curl -fsSL -o t.tpz $URL/${N}_export_templates.tpz
          unzip -q -j t.tpz 'templates/version.txt' 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' \
            -d ~/.local/share/godot/export_templates/$T/
          rm t.tpz

      - name: Yorumlayıcı, sahne, animasyon ve 100 seviyelik devre kampanyası testleri
        shell: bash
        run: |
          G="$HOME/godot48/godot"; chmod +x "$G"; "$G" --headless --version
          cd godot-program
          set +e
          timeout 180 "$G" --headless --import >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then echo "::error::Zaman aşımı: import"; exit 1; fi
          timeout 180 "$G" --headless --script res://tests/run_programs.gd 2>&1 | grep -E "seviye|HATA|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tests/run_themes.gd 2>&1 | grep -E "themes|HATA|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless -- --autotest 2>&1 | grep -E "autotest|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless -- --feeltest 2>&1 | grep -E "feeltest|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tests/run_parts.gd 2>&1 | grep -E "parts:|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tests/run_assets.gd 2>&1 | grep -E "assets:|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tests/run_features.gd 2>&1 | grep -E "features:|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tests/run_clarity.gd 2>&1 | grep -E "clarity:|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tests/run_cinematics.gd 2>&1 | grep -E "cinematics:|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless -- --perfcheck 2>&1 | grep -E "perfcheck|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless --script res://tools/level_database_builder.gd -- --check 2>&1 | grep -E "levels_100|ÇÖZÜMSÜZ|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          timeout 180 "$G" --headless -- --layouttest 2>&1 | grep -E "layouttest|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
          # arayüz denetimi: tipik telefonda (1080×2400, 420 dpi) dokunma ≥ 48 dp, yazı ≥ 12 sp, taşma yok
          timeout 180 "$G" --headless -- --uiaudit=1080x2400@2.625 2>&1 | grep -E "uiaudit|^  |SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0

      - name: Android APK dışa aktar
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          export GODOT="$HOME/godot48/godot" PROJECT=godot-program
          export RELEASE_KEYSTORE="$PWD/android/keystore/kayipkuleler.jks" RELEASE_KEY_ALIAS=kayipkuleler RELEASE_KEY_PASS=kayipkuleler
          chmod +x "$GODOT" tools/godot-android-export.sh
          # Elle etiket verilmişse o kullanılır. Aksi halde proje sürümü (ör. 2.4.2) geçerlidir;
          # main'e push bu sürümle GitHub Release açar.
          if [ -n "${RELEASE_TAG:-}" ]; then
            VER="${RELEASE_TAG#v}"
          else
            VER=$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' godot-program/project.godot | head -1)
          fi
          [ -n "$VER" ] || VER="2.0.${GITHUB_RUN_NUMBER}"
          echo "Sürüm adı: $VER"
          sed -i "s/^version\/code=.*/version\/code=$((2000 + GITHUB_RUN_NUMBER))/" godot-program/export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"$VER\"/" godot-program/export_presets.cfg
          tools/godot-android-export.sh "$PWD/dist/KayipKuleler-$VER-debug.apk" debug
          tools/godot-android-export.sh "$PWD/dist/KayipKuleler-$VER.apk" release
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Google Play App Bundle (.aab, Gradle) — başarısız olursa APK yayını etkilenmez
        continue-on-error: true
        shell: bash
        run: |
          export GODOT="$HOME/godot48/godot"
          export RELEASE_KEYSTORE="$PWD/android/keystore/kayipkuleler.jks" RELEASE_KEY_ALIAS=kayipkuleler RELEASE_KEY_PASS=kayipkuleler
          timeout 1500 tools/godot-android-aab.sh "$PWD/dist/KayipKuleler-$VER.aab"

      - name: Google Play uyumluluk denetimi (hedef API, izinler, debuggable, 64 bit)
        shell: bash
        run: |
          files="dist/KayipKuleler-$VER.apk"
          [ -s "dist/KayipKuleler-$VER.aab" ] && files="$files dist/KayipKuleler-$VER.aab"
          python3 tools/check_play_compliance.py $files

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KayipKuleler-aab
          path: dist/*.aab
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: KayipKuleler-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Bu sürüm yayınlanmış mı?
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ env.VER }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$VER zaten yayınlanmış; atlanıyor"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.publish == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}', env.VER) }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('Kayıp Kuleler {0}', inputs.release_tag != '' && inputs.release_tag || format('v{0}', env.VER)) }}
          prerelease: ${{ startsWith(inputs.release_tag || '', 'g4-') }}
          files: |
            dist/KayipKuleler-${{ env.VER }}.apk
            dist/KayipKuleler-${{ env.VER }}.aab
          generate_release_notes: true
