name: Android APK (Three.js + WebView)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Sürüm adı
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle (debug + release)
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK'ları adlandır
        shell: bash
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/KayipKuleler-${{ steps.ver.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "../dist/KayipKuleler-${{ steps.ver.outputs.name }}.apk"
          ls -la ../dist

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KayipKuleler-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
