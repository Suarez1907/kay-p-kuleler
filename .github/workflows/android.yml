name: Web APK (Three.js + WebView, eski sürüm)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Sürüm adı (ör. 1.4.1). Eski WebView APK derlemesi; artık Releases sayfasına yüklenmez."
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 defaults to the removed "tools" package and fails on current cmdline-tools
      # (sdkmanager: Failed to find package 'tools'). v4 installs platform-tools only.
      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle önbelleği
        uses: gradle/actions/setup-gradle@v4

      - name: Sürüm adı
        id: ver
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: APK derle (debug + release)
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: APK'ları adlandır
        shell: bash
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/KayipKuleler-${{ steps.ver.outputs.name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "../dist/KayipKuleler-${{ steps.ver.outputs.name }}.apk"
          ls -la ../dist

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: KayipKuleler-apk-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
