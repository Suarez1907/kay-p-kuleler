name: Seviye testleri

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  solver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - name: Tüm seviyeler çözülebilir mi? (BFS çözücü)
        run: node build.mjs
      - name: Derlenmiş seviye dosyaları güncel mi?
        run: git diff --exit-code -- ../web/levels.json ../web/js/levels.js ../godot/data/levels.json
      - name: Tarayıcıda uçtan uca test (headless Chrome)
        run: |
          (cd ../web && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node test.mjs
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ekran-goruntuleri
          path: screenshots/
          if-no-files-found: ignore

  godot-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.3 indir
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot && chmod +x godot
      - name: GDScript motorunda tüm çözümler
        run: |
          ./godot --headless --path godot --import >/dev/null 2>&1 || true
          ./godot --headless --path godot --script res://tests/run_solutions.gd
      - name: Tam sahne otomatik testi
        run: ./godot --headless --path godot -- --autotest 2>&1 | grep -E "autotest|SCRIPT ERROR"; test "${PIPESTATUS[0]}" -eq 0
        shell: bash
